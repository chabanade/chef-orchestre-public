# Configuration bilingue du moteur NLP de Presidio (format officiel :
# docs/analyzer/languages-config.yml du depot microsoft/presidio).
# Le francais s'ajoute a l'anglais, il ne le remplace pas.

nlp_engine_name: spacy
models:
  - lang_code: en
    model_name: en_core_web_lg
  - lang_code: fr
    model_name: fr_core_news_md

ner_model_configuration:
  model_to_presidio_entity_mapping:
    PER: PERSON
    PERSON: PERSON
    LOC: LOCATION
    LOCATION: LOCATION
    GPE: LOCATION
    ORG: ORGANIZATION
    DATE: DATE_TIME
    TIME: DATE_TIME
    NORP: NRP

  low_confidence_score_multiplier: 0.4
  low_score_entity_names:
    - ORGANIZATION
    - ORG
  default_score: 0.85
